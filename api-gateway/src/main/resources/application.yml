spring:
    application:
        name: api-gateway

    cloud:
      gateway:
          server:
              webflux:
                routes:
                      - id: product-service
                        uri: lb://PRODUCT-SERVICE
                        predicates:
                          - Path=/api/products/**
                        filters:
                          - AddResponseHeader=X-System-Name, Api-Gateway-System
server:
    port: 8080

eureka:
    client:
        service-url:
          defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true
        lease-renewal-interval-in-seconds: 5
        lease-expiration-duration-in-seconds: 10